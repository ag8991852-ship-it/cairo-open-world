}

for(let x=-95;x<=95;x+=30){if(Math.abs(x)<20)continue;for(const s of [-1,1])building(x,s*24,23,18,17+((x+100)%4)*5,Math.abs(x/30)+1)}

const marker=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.12,24),gold);marker.position.set(15,.3,-34);scene.add(marker);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.25,.12,8,32),gold);ring.rotation.x=Math.PI/2;ring.position.set(15,.3,-34);scene.add(ring);

const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),skin);head.position.y=2.45;head.castShadow=true;player.add(head);

const legs=[];for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.72,4,7),pants);leg.position.set(s*.23,.65,0);player.add(leg);legs.push(leg);const foot=new THREE.Mesh(new THREE.BoxGeometry(.34,.18,.52),shoe);foot.position.set(s*.23,.16,-.12);player.add(foot)}

// cars
const cars=[];const carColors=[0xc8c6bd,0x2e526a,0x9e4234,0xd0a34b,0x252a2e,0x56725b];
function makeCar(x,z,axis,dir,speed){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.85,4),mat(carColors[cars.length%carColors.length],.55,.15));body.position.y=.8;body.castShadow=true;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.85,1.9),glass);cabin.position.set(0,1.48,-.2);g.add(cabin);for(const xx of [-1,1])for(const zz of [-1.25,1.25]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.22,12),dark);wh.rotation.z=Math.PI/2;wh.position.set(xx,.42,zz);g.add(wh)}g.position.set(x,0,z);scene.add(g);cars.push({g,axis,dir,speed,origin:axis==='z'?z:x})}
for(let i=0;i<8;i++){makeCar(i%2?3:-3,-95+i*27,'z',i%2?1:-1,5+Math.random()*3);makeCar(-95+i*27,i%2?3:-3,'x',i%2?1:-1,4+Math.random()*3)}

const people=[];function pedestrian(x,z,color){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.65,3,6),mat(color));b.position.y=1.2;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.22,8,7),skin);h.position.y=1.9;g.add(h);g.position.set(x,0,z);scene.add(g);people.push({g,x,z,phase:Math.random()*6})}

// ambient landmarks and signage
const sign=box(7,1.5,.2,mat(0x244f50),0,5,-15);const signText=document.createElement('canvas');signText.width=512;signText.height=128;const ctx=signText.getContext('2d');ctx.fillStyle='#244f50';ctx.fillRect(0,0,512,128);ctx.fillStyle='#f4d18a';ctx.font='bold 54px Cairo';ctx.textAlign='center';ctx.fillText('القاهرة • وسط البلد',256,82);const tex=new THREE.CanvasTexture(signText);sign.material=new THREE.MeshStandardMaterial({map:tex});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let yaw=0,moveX=0,moveY=0,running=false,velocityY=0,onGround=true,elapsed=0,money=250,missionDone=false,clockMinutes=510;
const panel=document.querySelector('#panel'),toast=document.querySelector('#toast');
function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function interact(){if(player.position.distanceTo(new THREE.Vector3(15,0,-34))<7){if(!missionDone){missionDone=true;money+=100;document.querySelector('#money').textContent=money;document.querySelector('#missionText').textContent='أحسنت! وصلت للمحطة. استكشف المدينة بحرية.';say('أنجزت أول مشوار! +100 جنيه')}else say('المحطة الرئيسية • وسط البلد')}else say('استكشف المكان واقترب من العلامة الذهبية للتفاعل')}

document.querySelector('#interact').onclick=interact;document.querySelector('#jump').onclick=jump;document.querySelector('#run').onpointerdown=()=>running=true;document.querySelector('#run').onpointerup=()=>running=false;
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let active=false;function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=42;if(l>max){dx*=max/l;dy*=max/l}knob.style.transform='translate('+dx+'px,'+dy+'px)';moveX=dx/max;moveY=dy/max}
stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(active)stickMove(e)});function resetStick(){active=false;moveX=moveY=0;knob.style.transform=''}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
let drag=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag=true;lastX=e.clientX}});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.005;lastX=e.clientX}});

const clock=new THREE.Clock();const v=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3();

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+moveX,iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+moveY;
